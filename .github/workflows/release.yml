# Builds "yt-dlp Studio Setup.exe" on GitHub's own Windows machines and attaches it to a Release.
# Runs when a version tag like v2.0.0 is pushed (or manually from the Actions tab).
name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle the latest official yt-dlp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile bin/yt-dlp.exe

      - name: Build the installer
        run: python installer/build.py

      - name: Name the download and write a checksum
        shell: pwsh
        run: |
          Copy-Item "dist/yt-dlp Studio Setup.exe" "dist/yt-dlp-Studio-Setup.exe"
          $hash = (Get-FileHash "dist/yt-dlp-Studio-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  yt-dlp-Studio-Setup.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Keep the build (manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-Studio-Setup
          path: |
            dist/yt-dlp-Studio-Setup.exe
            dist/SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: yt-dlp Studio ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/yt-dlp-Studio-Setup.exe
            dist/SHA256SUMS.txt
