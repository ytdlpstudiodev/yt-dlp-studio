<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="studio-token" content="{{TOKEN}}">
<meta name="studio-instance" content="{{INSTANCE}}">
<title>yt-dlp Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2332b45c'/%3E%3Cpath d='M16 8v11m0 0l-5-5m5 5l5-5M9 24h14' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hdr">
  <form id="addForm" class="join add-form" autocomplete="off">
    <input id="urlInput" class="input join-item grow" type="text" inputmode="url" spellcheck="false"
           placeholder="Enter a video/playlist link to add to the queue" aria-label="Video or playlist link">
    <button class="btn primary join-item" id="addBtn" type="submit">Add</button>
    <div class="dropdown">
      <button class="btn primary join-item caret" id="addMore" type="button" aria-label="More add actions" data-icon="chevron-down"></button>
      <ul class="menu" id="addMenu" hidden>
        <li><button type="button" id="mWatch" data-icon="clipboard"><span>Watch clipboard</span></button></li>
        <li><button type="button" id="mPaste" data-icon="clipboard-paste"><span>Paste links from clipboard</span></button></li>
        <li><button type="button" id="mImport" data-icon="file-up"><span>Import links</span></button></li>
      </ul>
    </div>
  </form>
  <a class="btn subtle square" href="#/settings/downloads" title="App Settings" aria-label="App Settings" data-icon="cog"></a>
</header>

<div id="banner" class="banner" hidden></div>

<main id="main">
  <section id="home" class="home">
    <div id="empty" class="empty-state">
      <svg viewBox="0 0 24 24" class="big-arrow" aria-hidden="true"><path d="M12 20V4m0 0-6 6m6-6 6 6"/></svg>
      <p class="t1">Your queue is empty</p>
      <p class="t2">Add some videos to get started.</p>
    </div>
    <div id="cards" class="cards"></div>
  </section>
  <section id="page" class="page" hidden></section>
  <div id="dropOverlay" class="drop-overlay" hidden>
    <div><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>Drop links to add them to the queue</div>
  </div>
</main>

<footer class="ftr">
  <div class="progress big" id="totalProgress"><div class="fill"></div><span class="label"></span></div>
  <div class="ftr-row">
    <div class="join">
      <a class="btn join-item square" id="locBtn" href="#/location" title="Locations" aria-label="Locations" data-icon="folder"></a>
      <a class="btn join-item square" id="authBtn" href="#/auth" title="Log in" aria-label="Log in" data-icon="key"></a>
      <a class="btn join-item square" id="subsBtn" href="#/subtitles" title="Subtitles" aria-label="Subtitles" data-icon="captions"></a>
    </div>
    <div class="vdiv"></div>
    <div class="join global-format">
      <select id="gTrack" class="select join-item" aria-label="Select track for all videos"></select>
      <select id="gQuality" class="select join-item" aria-label="Select format for all videos"></select>
    </div>
    <div class="vdiv"></div>
    <div class="join dropdown">
      <button class="btn subtle join-item square" id="trashBtn" type="button" title="Empty queue" aria-label="Empty queue" data-icon="trash"></button>
      <button class="btn subtle join-item caret" id="trashMore" type="button" aria-label="More queue actions" data-icon="chevron-up"></button>
      <ul class="menu up" id="trashMenu" hidden>
        <li><button type="button" data-clear="done" data-icon="broom"><span>Clear successful</span></button></li>
        <li><button type="button" data-clear="error" data-icon="broom"><span>Clear errored</span></button></li>
        <li><button type="button" data-clear="pending" data-icon="broom"><span>Clear pending</span></button></li>
        <li><button type="button" data-queue="cancel" data-icon="x"><span>Cancel downloading</span></button></li>
        <li><button type="button" data-queue="pause" data-icon="pause"><span>Pause all</span></button></li>
        <li><button type="button" data-queue="resume" data-icon="play"><span>Resume all</span></button></li>
      </ul>
    </div>
    <button class="btn primary" id="downloadAll" type="button">Download</button>
  </div>
</footer>

<input type="file" id="importFile" accept=".txt,.csv,text/plain,text/csv" hidden>
<div class="offline" id="offline" hidden><div><span class="spinner"></span>Reconnecting to yt-dlp Studio…</div></div>
<div class="toasts" id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
